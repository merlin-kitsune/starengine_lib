# 平台属性:NeoForge 26.1.2(与消费方 astral_dice_multiloader/neoforge-26.1.2 同参数)
# 注意:**没有** parchment 配置 —— Parchment 官方 maven 对 26.1 / 26.1.1 / 26.1.2 / 26.2 全部 404
# (仅到 1.21.x 为止),build.gradle 里不得出现 parchment { ... } 块,故此处也不声明
# parchment_minecraft_version / parchment_mappings_version。
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForge 版本号 = <MC 版本>.<构建号>;26.1.2 线最新稳定为 26.1.2.109
neo_version=26.1.2.109
# 加载器语言区间仍用 FML 主版本(与 1.21.1 侧同构)
loader_version_range=[1,)

## 库自身版本
# 与另两个平台(neoforge-1.21.1 / forge-1.20.1)严格同号,升级时三处必须一起改。
# 该版本号不以 -SNAPSHOT 结尾,按 Maven 语义属普通版本,内容变更必须 bump。
lib_version=1.0.0-SNAPSHOT.3
# mod_version 用于 neoforge.mods.toml 中展示(带加载器后缀,与消费方约定一致)
mod_version=1.0.0-SNAPSHOT.3+neoforge_26.1.2

## 模组元数据
mod_id=starengine_lib
mod_name=StarEngine Lib
mod_license=MIT License
mod_group_id=com.merlinkitsune.starenginelib

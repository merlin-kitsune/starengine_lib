# 平台属性:NeoForge 26.1.2(与消费方 astral_dice_multiloader/neoforge-26.1.2 同参数)
# 注意:**没有** parchment 配置 —— Parchment 官方 maven 对 26.1 / 26.1.1 / 26.1.2 / 26.2 全部 404
# (仅到 1.21.x 为止),build.gradle 里不得出现 parchment { ... } 块,故此处也不声明
# parchment_minecraft_version / parchment_mappings_version。
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
# NeoForge 版本号 = <MC 版本>.<构建号>;26.1.2 线最新稳定为 26.1.2.109
neo_version=26.1.2.109
# 加载器语言区间仍用 FML 主版本(与 1.21.1 侧同构):该键进模板的 **loaderVersion**(javafml
# 语言提供者版本槽),只能写语言区间 —— 26.1.2 侧本就是 [1,) ,未触发 1.21.1 那次 FML 拒载
# (2026-09-17 两份 crash-*-fml.txt);NeoForge 版本带 [26.1.0.0,26.2) 在模板的 modId="neoforge" 依赖上。
loader_version_range=[1,)

## 库自身版本
# 1.0.2:「额外敌对判定」seam(2026-09-24)
#   combat/HostileTargets 新增消费方注入入口 —— ExtraHostileProbe / installExtraHostileProbe:
#   让消费方把「既非 Enemy、也非被激怒中立生物」的实体声明为敌对目标(典型:第三方**测试假人**),
#   使「需要敌对目标」的效果(含库内 target/SelectorTargets 的客户端射线/半径高亮/服务端确认三处
#   可选中判定)能正确选中它。
#   **纯新增** —— 新嵌套类型 + 新静态方法 + 既有 isHostile(Entity) 末尾追加一次 probe 调用
#   (两参重载经既有委托自动继承);未删除/改名/改签名任何既有 API,「未注入」时既有语义逐字不变
#   ⇒ 符合下方 1.x 兼容契约,消费方区间 [1.0.0,2.0) 的语义不变(下界随即收紧到 1.0.2)。
#   ⚠️ 版本号**跳过 1.0.1**:该号从未推送、从未发布,但 mavenLocal 里仍留有 2026-09-22 的
#   1.0.1 目录(已撤销版本的残留)—— 复用该号属「同号覆盖」,消费方可能静默解析到旧 jar
#   (须 --refresh-dependencies 才能纠正),故新改动另起 1.0.2,保证首次解析即命中新产物。
# 与另两个平台(neoforge-1.21.1 / forge-1.20.1)严格同号,升级时三处必须一起改。
# 该版本号不以 -SNAPSHOT 结尾,按 Maven 语义属普通版本,内容变更必须 bump。
# 1.0.0-SNAPSHOT.11:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明 —— 删除充能冷却比例减免
#   常量,改为两个「有充能时的冷却上限」常量(立牌 160 秒 / 效果牌 20 秒)。
# 1.0.0-SNAPSHOT.10:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明 —— 并入 `.6` 的
#   loaderVersion 拒载修复与 forge 侧原 `.7` 在途的 `pack.mcmeta` 资源包元数据修复;版本号统一为
#   `.10`,与消费方 `2.0.0-SNAPSHOT.10` 的 patch 段对齐。本平台**代码与元数据值均未改**
#   (`loader_version_range` 仍是 [1,)、`neoforge` 依赖仍是 [26.1.0.0,26.2),`pack.mcmeta`
#   只在 Forge 1.20.1 侧需要),仅随共享版本线同号 bump。
# 1.0.0-SNAPSHOT.6:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明(修复库自身被 FML
#   拒载的根因:1.21.1 侧 loaderVersion 误填 NeoForge 版本带 ⇒ 改 [1,);并顺带对齐 forge 门槛)。
#   本平台 **代码与元数据值均未改**(loader_version_range 仍是 [1,)、neoforge 依赖仍是
#   [26.1.0.0,26.2)),仅随共享版本线同号 bump,使三平台坐标一致、消费方一次解析即可全取新 jar。
# 1.0.0-SNAPSHOT.5:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明
#   (合并后按期删除过渡符号,含事件框架三件套 AstralEventType/EventContext/EventEffect;
#    本平台曾为 AstralEventType 留的 sourceSets exclude 行已随文件删除一并移除)。
# 1.0.0-SNAPSHOT.4:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明
#   (Phase 1d 补齐下沉 common/effect/ReadyEffect 并固化三线共享单元判定口径,
#    排除项与理由见 temp/sink-manifest-20260917.md)。
# 1.0.0:**首个正式版**(由 1.0.0-SNAPSHOT.16 规范化而来,库内 Java 源码零改动)。
#   本平台代码与元数据值均未改(loader_version_range 仍是 [1,)、neoforge 依赖仍是 [26.1.0.0,26.2));
#   2026-09-22 同日的「移除 forge 侧 Curios 前置」原拟作 1.0.1,经用户裁决**并入 1.0.0**
#   (不单独发版),变更详情见 neoforge-1.21.1/gradle.properties 的 1.0.0 条目。
#   同轮还**为本侧补齐 `NeoForgeEconomyStorage`**(钱包账本的平台存储实现 —— 缺它时本线
#   `StarEngineEconomy.isAvailable()` 恒 false);该改动原拟作 1.0.1 单独发版,经用户裁决
#   **并入 1.0.0**(不单独发版),详情同上。
#   **兼容性契约(全局约定)见 neoforge-1.21.1/gradle.properties 的 1.0.0 条目** ——
#   同一主版本号(1.x)内禁止任何破坏性更新,破坏性变更必须升第一位并收紧消费方区间下界。
lib_version=1.0.2
# mod_version 用于 neoforge.mods.toml 中展示(带加载器后缀,与消费方约定一致)
mod_version=1.0.2+neoforge_26.1.2


modLoader="javafml"

# 加载器(javafml 语言提供者)版本门槛:该槽比的是语言提供者版本(不是 NeoForge 版本带),故写
# 语言区间(= gradle.properties 的 loader_version_range,当前 [1,));NeoForge 版本带
# [26.1.0.0,26.2) 属于下面 modId="neoforge" 依赖(见同处注释)。
# (1.21.1 侧曾在 2026-09-17 把版本带写进该槽而触发 FML 拒载 crash-*-fml.txt,本平台一直是 [1,)。)
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="MerlinKitsune, Nintyfive95"
description='''
StarEngine 星引擎 —— Astral Dice(星之骰戏)系列模组共用的引擎库。

本库不注册任何注册表条目(物品/效果/附件/数据组件/能力全部留在消费方 mod),
因此搬迁不会改变任何 ResourceLocation 归属,不破坏存档与数据包。

共享源码位于仓库 common/ 目录,由 1.20.1、1.21.1 与 26.1.2 三个平台各自编译一次。
'''

# NeoForge 依赖区间:26.1.x.y 全接纳(二号位 band,与 1.21.1 侧 [21.1,21.2) 同构),
# 26.2 / 26.3 一律拒绝。此处按 26.1.2 线的实际取值硬编码,不用属性占位(与 1.21.1 侧一致)。
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[26.1.0.0,26.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

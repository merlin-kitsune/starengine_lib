#    排除项与理由见 temp/sink-manifest-20260917.md;必须 bump 以拒绝缺该类的 .3 旧 jar)。
# 1.0.0-SNAPSHOT.3:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明

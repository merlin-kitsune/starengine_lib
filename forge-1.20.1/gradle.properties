# 平台属性:Forge 1.20.1(与消费方 astral_dice_multiloader/forge-1.20.1 同参数)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=1.20.1-47.4.10
# ⚠️ 该键由 mods.toml 模板写进 **loaderVersion** —— 那是 javafml **语言提供者**的版本槽:只能卡到
#    **Forge 主系列号**(javafml 语言提供者的版本号就是主系列号 `47`,与完整版本号 `47.4.10` 不同构);
#    写成 `[47.4.10,48)` 会被 FML 判为 `fml.language.missingversion` 而直接拒载本模组 ——
#    这与消费方 `astral_dice_multiloader` 的实测结论同构,也与本库 neoforge-1.21.1 侧「把 NeoForge
#    版本带写进该槽导致整个库 jar 被拒载」(2026-09-17 两份 FML 崩溃报告)是同一个坑。
#    精确下限 `[47.4.10,48)` 放在模板里 `modId="forge"` 的**强制依赖**上,由 build.gradle 从
#    `forge_version` 派生(`forge_version_range`),在 FML 依赖排序阶段拒绝旧环境。
loader_version_range=[47,48)

## 库自身版本
# 与 neoforge-1.21.1/gradle.properties 严格同号(两侧共用一个版本线)。
# 该版本号不以 -SNAPSHOT 结尾,按 Maven 语义属普通版本,内容变更必须 bump。

#   常量,改为两个「有充能时的冷却上限」常量(立牌 160 秒 / 效果牌 20 秒)。
# 1.0.0-SNAPSHOT.10:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明 —— 并入 `.6` 的
#   loaderVersion 拒载修复(= 本文件 `loader_version_range=[47,48)` 与 build.gradle 派生的
#   `modId="forge"` 依赖 `[47.4.10,48)`,两者均保持不变)与本侧原 `.7` 在途的**资源包元数据修复**
#   (`src/main/resources/pack.mcmeta`,`pack_format` 15);版本号统一为 `.10`,与消费方
#   `2.0.0-SNAPSHOT.10` 的 patch 段对齐。`.7` 只发布过 mavenLocal、未进入 git,故并入 `.10` 不单列。
# 1.0.0-SNAPSHOT.6:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明(库自身被 FML 拒载的
#   根因修复)。本侧顺带对齐已文档化口径:`loaderVersion` 由 `[47,)` 收敛为 `[47,48)`(语言主系列
#   区间,见本文件第 7 行),`modId="forge"` 依赖改用 build.gradle 从 `forge_version` 派生的精确区间
#   `[47.4.10,48)`(模板由 `${loader_version_range}` 改为 `${forge_version_range}`)。库内 Java 源码

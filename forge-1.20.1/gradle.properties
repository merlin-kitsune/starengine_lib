# 平台属性:Forge 1.20.1(与消费方 astral_dice_multiloader/forge-1.20.1 同参数)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=1.20.1-47.4.10
loader_version_range=[47,)

## 库自身版本
# 与 neoforge-1.21.1/gradle.properties 严格同号(两侧共用一个版本线)。
# 该版本号不以 -SNAPSHOT 结尾,按 Maven 语义属普通版本,内容变更必须 bump。
# 1.0.0-SNAPSHOT.2:同侧变更原因见 neoforge-1.21.1/gradle.properties 的说明
#   (包名 starengine -> starenginelib 的破坏性改名,必须 bump 以拒绝改名前的旧 jar)。
lib_version=1.0.0-SNAPSHOT.2
mod_version=1.0.0-SNAPSHOT.2+forge_1.20.1

## 模组元数据
mod_id=starengine_lib
mod_name=StarEngine Lib
mod_license=MIT License
mod_group_id=com.merlinkitsune.starenginelib

## 前置库:Cloth Config
# 11.1.136 对应 MC 1.20.1 / Forge 47.x(对侧 1.21.1 为 15.0.140,见 neoforge-1.21.1/gradle.properties)。
# 两版本的核心 API(ConfigBuilder/ConfigEntryBuilder/autoconfig.*)已实测逐字节一致,
# common 里的配置 schema 才能共享;升级时务必成对升级并重新比对。
cloth_config_version=11.1.136
# mods.toml 中的依赖版本区间:与消费方保持一致,允许 11.x 起的向后兼容小版本。
cloth_config_version_range=[11,)

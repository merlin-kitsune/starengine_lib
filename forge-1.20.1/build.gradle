// StarEngine-Lib / Forge 1.20.1 平台子项目
// Java 17 · Mojmap + Parchment(构建期 reobf 为 SRG)· ModDevGradle Legacy 2.0.144
//
// 源码 = 本子项目 src/main/java(平台专有) + ../../common/src/main/java(共享)
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
    id 'idea'
}

version = lib_version
group = mod_group_id

base {
    archivesName = 'starengine_lib-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// === 共享源码目录(与 NeoForge 侧同一份) ===
sourceSets.main.java.srcDir(project.file('../common/src/main/java'))

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
    // Curios 1.20.1 来自 Modrinth maven(仅供 item/CuriosCompat 的**编译期**引用)
    maven { url 'https://api.modrinth.com/maven' }
}

legacyForge {
    version = project.forge_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Curios API(1.20.1 Forge = Curios 5.x)—— **仅编译期**(modCompileOnly),不声明为前置。
    // 依据(2026-09-22 用户裁决「移除 curios api 前置,与另两平台保持一致」):
    //   ① 库自身**零调用** item/CuriosCompat(它只是给消费方用的 shim),库内无任何路径会加载它
    //      ⇒ 运行期既不需要 Curios,也不该让本库的 mods.toml 替消费方强制它;
    //   ② 三平台由此一致(neo 两线本来零 Curios);**调用 CuriosCompat 的消费方自己声明 curios 必需**
    //      (astral_dice 的 1.20.1 侧已声明 mandatory=true [5,6));
    //   ③ 必须用 modCompileOnly 而非 compileOnly:MDG LegacyForge 只对 mod* 配置走 RemappingTransform
    //      (Mojmap/Parchment),否则 CuriosCompat 的 `LivingEntity` 形参在编译期对不上 Curios 的方法描述符。
    modCompileOnly "maven.modrinth:curios:IPQlZkz1"
}

// Forge 自身版本门槛(**单一来源 = gradle.properties 的 forge_version**,形如 1.20.1-47.4.10;
// 口径与消费方 astral_dice_multiloader/forge-1.20.1/build.gradle:139-152 完全一致):
//   · loaderVersion(模板第 2 行)= **语言区间** `[<major>,<major+1>)` —— javafml 语言提供者的版本号
//     就是 Forge 主系列号(47),与完整版本号不同构;写 `[47.4.10,48)` 会被 FML 以
//     `fml.language.missingversion` 直接拒载整个库 jar(同本库 1.21.1 侧 2026-09-17 的拒载事故)。
//   · `modId="forge"` 强制依赖(模板第 22 行)= **精确区间** `[<forge_version>,<major+1>)`,由 FML
//     在依赖排序阶段拒绝旧环境。
// 因此该属性只承担「语言区间」,精确下限由下面派生出的 forge_version_range 承担。
def forgeSemver = project.forge_version.toString().split('-').last()
def forgeMajor = (forgeSemver.split('\\.')[0] as int)
def forgeVersionRange = "[${forgeSemver},${forgeMajor + 1})"
logger.lifecycle("forgeVersionRange: ${forgeVersionRange} (derived from forge_version=${forge_version}); " +
        "loaderVersion=${loader_version_range}")

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forgeVersionRange,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

// === 发布 ===
// 关键:Forge 1.20.1 消费方(MDG legacyforge)通过 modImplementation 引入库时,
// 会把「生产 SRG jar」重映射为 dev Mojmap 命名。因此本地 maven 必须发布 reobfJar
// (build/libs 下的 SRG 重混淆产物),而不是 build/devlibs 下未重混淆的 dev jar。
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 显式坐标:默认 artifactId 会退化为子项目名(forge-1.20.1)。
            artifactId = 'starengine_lib-forge-1.20.1'
            artifact tasks.named('reobfJar')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// === 编译产物部署 ===
// 本库是消费方 astral_dice 的必需前置(mods.toml mandatory=true)。
// 消费方 build 会自动把自身 jar 推送进整合包;库若不在同一时机进入整合包,
// 整合包会因「缺失必需前置」直接拒绝启动。故库的 build 也默认推送。
// 约定与消费方一致:推送 reobfJar(SRG 生产 jar),旧版清理按 starengine_lib- 前缀。
//
// ⚠️ 约定(2026-09-22 修订为**白名单**,与消费方 astral_dice 同构):**只有发布线分支推送整合包。**
//   本库与消费方 astral_dice 必须**成对匹配**才能进整合包:
//   消费方在编译期锁定库版本(starengine_lib_version),并在 mods.toml 声明库版本区间;
//   库 jar 与 mod jar 只要一侧先单独演进,整合包就会进入"不匹配"状态,
//   表现为启动期 NoClassDefFoundError(包名/类名对不上)或「缺必需前置」。
//   本库发布线 = `main`;消费方发布线 = `multi-main`。2026-09-12 起曾因消费方开发线冻结而一并停推,
//   现消费方多线已收编进 multi-main,两侧同步解冻。
//   判定依据是当前 git 分支(读 .git/HEAD,兼容普通仓库与 worktree):
//     · 分支出现在 packPushBranches(**白名单**)中 → 允许 pushToPack
//     · 分支不在白名单 / 无法确定分支(detached HEAD/无 .git,如 CI) → 跳过,只打日志,不算失败
//     · 传 -PdeployToPack 或 -PpackPush → 强制推送(手动出包用;务必与消费方成对推送)
//   **白名单优于黑名单**:新建分支默认落在"不推送"一侧,不会因为忘了登记而误推、误删整合包里的正式 jar。
//   需要推送时:把分支加进白名单;或单次用 -PdeployToPack 强制。
def packModsDir = file('D:/.minecraft/versions/1.20.1 模组测试/mods')
def prodJarArchiveProvider = tasks.named('reobfJar').flatMap { it.archiveFile }

// --- 整合包推送的 git 分支守卫(配合上方约定) ---
// 分支判定放在**执行期**(见 pushToPack 的 doLast),不做配置期求值:
//   ① 每次构建都读当时的 .git/HEAD,切分支后立即生效,不存在配置缓存陈旧问题;
//   ② 不把 Provider/闭包塞进 configuration-cache,避免缓存序列化限制与行为漂移。
// dotGitEntry 是配置期算好的 File(可序列化),执行期读它即可 —— 普通仓库这里就是
// .git 目录;worktree 下它是**文件**,内容为 `gitdir: <path>`,真正的 HEAD 在 gitdir 下。
def packPushBranches = ['main']
def forcePackPush = project.hasProperty('deployToPack') || project.hasProperty('packPush')
def dotGitEntry = rootProject.file('.git')

tasks.register('pushToPack') {
    group = 'build'
    description = 'Copy the built production (SRG) jar into the Forge test pack mods folder, removing stale versions. Skipped on development branches; force with -PdeployToPack.'
    dependsOn tasks.named('reobfJar')
    doLast {
        // --- 约定:开发分支不推送整合包(见文件顶部「编译产物部署」) ---
        if (!forcePackPush) {
            // 执行期读取当前分支:普通仓库 .git 是目录;worktree 的 .git 是文件,内容记录 gitdir
            def readGitBranch = { File dotGit ->
                File headFile = null
                if (dotGit.isDirectory()) {
                    def hf = new File(dotGit, 'HEAD')
                    headFile = hf.isFile() ? hf : null
                } else if (dotGit.isFile()) {
                    def m = dotGit.text.trim() =~ /^gitdir:\s*(.+)$/
                    if (m.find()) {
                        def gd = new File(m.group(1).trim())
                        if (!gd.isAbsolute()) {
                            gd = new File(dotGit.parentFile, m.group(1).trim())
                        }
                        def hf = new File(gd, 'HEAD')
                        headFile = hf.isFile() ? hf : null
                    }
                }
                if (headFile == null) {
                    return ''
                }
                def s = headFile.text.trim()
                s.startsWith('ref: refs/heads/') ? s.substring('ref: refs/heads/'.length()) : ''
            }
            def branch = readGitBranch(dotGitEntry)
            if (branch.isEmpty()) {
                logger.lifecycle('pushToPack: skipped — 无法确定当前 git 分支(detached HEAD 或无 .git);如需强制推送请加 -PdeployToPack')
                return
            }
            if (!packPushBranches.contains(branch)) {
                logger.lifecycle("pushToPack: skipped — 分支 '${branch}' 不在整合包推送白名单 ${packPushBranches} 内;如需强制推送请加 -PdeployToPack")
                return
            }
        }
        def jarFile = prodJarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToPack: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!packModsDir.exists()) {
            def packRoot = packModsDir.getParentFile()
            if (packRoot == null || !packRoot.exists()) {
                logger.warn("pushToPack: pack dir not found, skipped: ${packModsDir}")
                return
            }
            packModsDir.mkdirs()
        }
        def stale = packModsDir.listFiles().findAll { File f ->
            f.isFile() && f.name.startsWith('starengine_lib-') && f.name.endsWith('.jar')
        }
        stale.each { it.delete() }
        def target = new File(packModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToPack: pushed ${jarFile.name} -> ${packModsDir}")
    }
}

tasks.named('build') {
    finalizedBy tasks.named('pushToPack')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

modLoader="javafml"

# 加载器(javafml 语言提供者)版本门槛:只能卡到 **Forge 主系列号**(= gradle.properties 的
# loader_version_range,当前 [47,48))—— javafml 语言提供者的版本号就是主系列号 47,与完整版本号
# 47.4.10 不同构;把它写成 [47.4.10,48) 会被 FML 判为 fml.language.missingversion 而**拒载整个 jar**。
# 精确下限 [47.4.10,48) 放在下面 modId="forge" 的强制依赖上(由 build.gradle 从 forge_version 派生)。
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="MerlinKitsune, Nintyfive95"
# ⚠️ 键名大小写敏感:必须是 logoFile(大写 F),写成 logofile 会被解析器**静默忽略**,
# 游戏 mod 界面永远不显示图标(2026-09-22 修正)。
logoFile="icon.png"
description='''
A common library for the Astral Dice mod. It includes cross-platform implementations and supports functional integration with other mods.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Curios 5.x:item/CuriosCompat(1.20.1 适配器)需要
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[5,6)"
    ordering="AFTER"
    side="BOTH"

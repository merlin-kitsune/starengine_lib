# ---- Fabric 1.20.1 平台子项目属性 ----
# Minecraft
minecraft_version=1.20.1
# ⚠️ 2026-09-29 修正:Fabric Loader 的版本谓词**不支持 Maven 区间语法**
#    (VersionPredicateParser 只解析 = / > / >= / < / <= / ~ / ^ 与通配符,
#     没有 `[` `(` `)` 的处理 ⇒ 原来的 `[1.20.1]` 被当成「等于字面量 '[1.20.1]'」,
#     于是 HARD_DEP_INCOMPATIBLE_PRESELECTED:「需要 minecraft 的 [1.20.1] 版本,
#     但已经安装了的版本 1.20.1 不对」)。`~1.20.1` = `>=1.20.1 <1.21.0`,语义等价且合法。
minecraft_version_range=~1.20.1

# Fabric Loader / API
loader_version=0.19.5
fabric_version=0.92.12+1.20.1

# 前置/编译期依赖
# ⚠️ 钱包持久化改用 Fabric API 自带的 fabric-data-attachment-api-v1(随 fabric_version 来),
#    本库**不再把 CCA 列为运行前置**。
#    cca_version 保留只为 **编译期**:Trinkets 3.7.2 的 TrinketComponent 继承 CCA 的
#    ComponentV3,javac 解析 TrinketsApi 签名时必须能加载它(modCompileOnly)。
#    运行期 CCA 由 Trinkets 自己 hard-depends(其 fabric.mod.json)⇒ 玩家无需单独安装。
trinkets_version=3.7.2
cca_version=5.2.3

## Mod Properties
mod_id=starengine_lib
mod_name=StarEngine Lib
mod_license=MIT License
mod_group_id=com.merlinkitsune.starenginelib

# 库版本(四线同号约定;本平台为新增线)
# ⚠️ 2026-09-29 用户裁决:本线一律用 **-alpha.x 预发布后缀**,基线退回 **1.0.5**
#    (1.0.6 / 1.0.7 / 1.0.8 是本地临时构建,不作为对外号)⇒ 现号 = **1.0.5-alpha.1**。
#    预发布号在库仓 CI 里**不会**打 tag(workflow 只认裸 x.y.z)⇒ 正合开发线口径。
# ⚠️ 1.0.5-alpha.1 = 修 AstralRarities 的**映射相关反射**:原用 getDeclaredField("color") / ("$VALUES")
#    按**字符串名**取原版 Rarity 成员,而 Fabric 的 dev(named) 与生产(intermediary) 字段名不同
#    (color → field_8908、$VALUES → field_8905) ⇒ dev 全绿、整合包**100% 启动崩**
#    (NoSuchFieldException: color → ExceptionInInitializerError → 入口点失败;KI-F13)。
#    改为按**类型/修饰符**查找(映射无关)。不改任何 public API/签名 ⇒ 属 1.x 允许的行为修正。
# 1.0.5-alpha.2:与三平台 1.0.6 **同一处 common 修复**(见 neoforge-1.21.1/gradle.properties 的 1.0.6 注释)。
#   ⚠️ 基线仍停在 1.0.5:本子项目的 `1.0.6` / `1.0.7` / `1.0.8` 已被前次裁决明确
#   「系本地临时构建、不作为对外号」⇒ 按 fabric 线既有 scheme 继续递增 `-alpha.N`。
lib_version=1.0.5-alpha.2
mod_version=1.0.5-alpha.2+fabric_1.20.1

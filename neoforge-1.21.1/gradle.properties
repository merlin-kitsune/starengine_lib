# 平台属性:NeoForge 1.21.1(与消费方 astral_dice_multiloader/neoforge-1.21.1 同参数)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.235
loader_version_range=[21.1,21.2)

## 库自身版本
# lib_version 用于 maven 坐标与 jar 文件名(纯 semver)
# 1.0.0-SNAPSHOT.1:本库首次对外发布(仓库托管到 GitHub)的版本号。
#   内容:效果/事件/目标选择/通用组件共享实现 + 公共配置模块
#        (StarEngineCommonConfig/StarEngineConfigs/StarEngineConfigScreen),并声明 cloth config 必需前置。
#   注意:SNAPSHOT 系列的 API 不作语义化兼容承诺,升级消费方前先比对共享源码。
#   注意:该版本号**不以 -SNAPSHOT 结尾**(而是 -SNAPSHOT.1),按 Maven 语义属于普通版本,
#        因此 Gradle 不会把它当作 changing module;库内容变更必须 bump 版本号,否则消费方会拿到缓存旧 jar。
lib_version=1.0.0-SNAPSHOT.1
# mod_version 用于 neoforge.mods.toml 中展示(带加载器后缀,与消费方约定一致)
mod_version=1.0.0-SNAPSHOT.1+neoforge_1.21.1

## 模组元数据
mod_id=starengine_lib
mod_name=StarEngine Lib
mod_license=MIT License
mod_group_id=com.merlinkitsune.starengine

## 前置库:Cloth Config
# 15.x 对应 MC 1.21.1 / NeoForge 21.x(对侧 1.20.1 为 11.1.136,见 forge-1.20.1/gradle.properties)。
# 两版本的核心 API(ConfigBuilder/ConfigEntryBuilder/autoconfig.*)已实测逐字节一致,
# common 里的配置 schema 才能共享;升级时务必成对升级并重新比对。
cloth_config_version=15.0.140
# mods.toml 中的依赖版本区间:与消费方保持一致,允许 15.x 起的向后兼容小版本。
cloth_config_version_range=[15,)

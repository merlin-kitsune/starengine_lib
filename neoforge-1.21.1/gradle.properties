## 库自身版本
# lib_version 用于 maven 坐标与 jar 文件名(纯 semver)
# 1.0.0-SNAPSHOT.4:Phase 1d 收尾,把三线共享的自包含单元补齐下沉并固化判定口径:
#   ① 新下沉 common/effect/ReadyEffect —— 三线(neoforge-1.21.1 / forge-1.20.1 / neoforge-26.1.2)
#      字节完全一致、只依赖 MC API 与库内已有类的自包含单元中,**唯一**尚未进库者;
#   ② 三线的 53 个「字节完全一致」候选逐一判定,其余 52 个的排除理由
#      (非三线一致 / 依赖消费方专有类 / mixin)见 temp/sink-manifest-20260917.md;
#   ③ 主线(multi-1.20.1-1.21.1)在 dev-next 删除这批类**之后**对其余文件的改动已逐条核对:
#      GameplayConstants 取主线常量值 + 暂留过渡符号、EventTargetCollector 暂留全量实现
#      (合并前消费方仍在调用 collectTargets)、BossEntityUtil/SignActiveTriggeredEvent/
#      ModEffectRemoval/ActionBarManager 的差异为 shim 与注释,均属有意设计,本次不改这些类。
#   必须 bump 的原因同 .3:该版本号不以 -SNAPSHOT 结尾(属普通版本),Gradle 不把它当作
#   changing module —— 不 bump 则消费方会继续解析 mavenLocal 里的 .3 旧 jar(缺 ReadyEffect),
#   随后在编译期报「找不到符号」。
# 1.0.0-SNAPSHOT.3:在 .2 基础上做两处**二进制不兼容**收敛:
#   ① 完全移除 Cloth Config 前置与公共配置模块(StarEngineCommonConfig/StarEngineConfigs/
#      LegacyCommonTomlImporter/StarEngineConfigScreen 全部删除),配置文件回归消费方自己的
#      ModConfigSpec / ForgeConfigSpec;库内只留平台无关的值快照 seam。
#   ② GameplayConfigValues 由 13 字段收敛为 6 字段(与消费方 TOML 的配置项一一对应),
#      GameplayConstants.refresh() 改为 applyConfig(GameplayConfigValues)。
#   另新增 neoforge-26.1.2 平台子项目(MC 26.1.2 / NeoForge 26.1.2.109 / Java 25 / 无 Parchment),
#   common 由「两版同源」变为「三版同源」;26.1 的 ResourceLocation→Identifier 与
#   EntityType#is(TagKey)→builtInRegistryHolder() 两处差异已下沉进 shim(见 README §1.3)。
#   注:AstralEventType/EventContext/EventEffect 与 KOMACHI_EXTRA_PLAYS_CAP 属「合并后即删」的
#   过渡符号,当前**暂留**(尚未合并主线的消费方仍在引用),不在本版本删除。
#   必须 bump 的原因:该版本号不以 -SNAPSHOT 结尾(属普通版本),Gradle 不会当作 changing module,
#   不 bump 则消费方会继续解析到 mavenLocal 里的 .2 旧 jar(带已删除的类),编译期就会报找不到符号。
# 1.0.0-SNAPSHOT.2:在 .1 基础上把 Java 包名由 com.merlinkitsune.starengine 改为
#    com.merlinkitsune.starenginelib(规避名称法律风险),maven group 随之变为
#    com.merlinkitsune.starenginelib。这是一次**破坏性**变更:消费方全部 import 需同步改写。
#    必须 bump 到 .2 的原因:若不 bump,改名前的 .1 库 jar(modId 同为 starengine_lib、
#    版本号同为 1.0.0-SNAPSHOT.1、但是旧包名)能通过消费方的 versionRange 检查,
#    随后因找不到 com.merlinkitsune.starenginelib.* 而 NoClassDefFoundError 崩溃;
#    bump 后消费方区间下界提到 [1.0.0-SNAPSHOT.2,2.0),旧 jar 会被明确判为「缺必需前置」。
#    (已用 maven-artifact 3.8.5 实测:该区间 reject 1.0.0-SNAPSHOT.1,accept .2/.3/.10/1.0.0/1.1.0)
# 1.0.0-SNAPSHOT.1:本库首次对外发布(仓库托管到 GitHub)的版本号。
#   内容:效果/事件/目标选择/通用组件共享实现,以及平台无关的配置值快照 seam
#        (GameplayConfigValues + GameplayConstants.applyConfig)。
#   注意:SNAPSHOT 系列的 API 不作语义化兼容承诺,升级消费方前先比对共享源码。
#   注意:该版本号**不以 -SNAPSHOT 结尾**(而是 -SNAPSHOT.N),按 Maven 语义属于普通版本,
#        因此 Gradle 不会把它当作 changing module;库内容变更必须 bump 版本号,否则消费方会拿到缓存旧 jar。
lib_version=1.0.0-SNAPSHOT.4
# mod_version 用于 neoforge.mods.toml 中展示(带加载器后缀,与消费方约定一致)
mod_version=1.0.0-SNAPSHOT.4+neoforge_1.21.1


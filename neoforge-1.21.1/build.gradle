// StarEngine-Lib / NeoForge 1.21.1 平台子项目
// Java 21 · Mojmap + Parchment · ModDevGradle 2.0.141 · 无需 refmap
//
// 源码 = 本子项目 src/main/java(平台专有) + ../../common/src/main/java(共享)
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

// maven 坐标版本:纯 semver,不含 + 构建元数据(文件名后缀由 archivesName 承担)
version = lib_version
group = mod_group_id

base {
    archivesName = 'starengine_lib-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// === 共享源码目录 ===
// common 不是 Gradle 子项目,而是被两个平台各自编译一次的源码目录。
// 因此 common 源码只能使用两版 MC 都存在且签名一致的 API,且不得使用 Java 21 独有语法
// (Java 17 侧也要编译同一份)。
sourceSets.main.java.srcDir(project.file('../common/src/main/java'))

repositories {
    mavenCentral()
    maven { url = uri('https://maven.neoforged.net/releases') }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // 本库不注册任何东西,也没有 mixin / AT;runs 留空,库由消费方 mod 的 run 加载。
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // 本库当前不引入任何第三方模组依赖:配置 schema 已回归各消费方自己的
    // ModConfigSpec / ForgeConfigSpec(见 README §3),库内只保留平台无关的
    // GameplayConfigValues 值快照与 GameplayConstants.applyConfig(...)。
    // 共享源码因此不含任何加载器或第三方库字面量,新增依赖前请先确认 common 是否需要它。
}

// 展开 mods.toml 模板中的 ${} 占位符
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // 显式坐标:默认 artifactId 会退化为子项目名(neoforge-1.21.1),
            // 与 archivesName 不一致会造成消费方书写困惑,故显式指定。
            artifactId = 'starengine_lib-neoforge-1.21.1'
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 注意:此处**不能**设 options.release = 17。
    // MC 1.21.1 / NeoForge 21.1 的类文件版本为 65(Java 21),--release 17 会因
    // "class file has wrong version 65.0, should be 61.0" 直接编译失败;
    // 且 NeoForge 1.21.1 要求 mod 目标为 Java 21。
    // common 源码「禁用 Java 21 独有语法」是由 forge-1.20.1 侧(Java 17 工具链)编译同一份源码来强制的。
}

// === 编译产物部署 ===
// 本库是消费方 astral_dice 的必需前置(mods.toml type="required")。
// 消费方 build 会自动把自身 jar 推送进整合包;库若不在同一时机进入整合包,
// 整合包会因「缺失必需前置」直接拒绝启动。故库的 build 也默认推送。
// NeoForge 编译与生产同为 Mojmap,直接推 build/libs 的普通 jar。
//
// ⚠️ 约定(2026-09-22 修订为**白名单**,与消费方 astral_dice 同构):**只有发布线分支推送整合包。**
//   本库与消费方 astral_dice 必须**成对匹配**才能进整合包:
//   消费方在编译期锁定库版本(starengine_lib_version),并在 mods.toml 声明库版本区间;
//   库 jar 与 mod jar 只要一侧先单独演进,整合包就会进入"不匹配"状态,
//   表现为启动期 NoClassDefFoundError(包名/类名对不上)或「缺必需前置」。
//   本库发布线 = `main`;消费方发布线 = `multi-main`(2026-09-22 由 multi-1.20.1-1.21.1 改名)。
//   2026-09-12 起曾因消费方开发线冻结而**一并停推**;现消费方多线已收编进 multi-main,两侧同步解冻。
//   判定依据是当前 git 分支(读 .git/HEAD,兼容普通仓库与 worktree):
//     · 分支出现在 packPushBranches(**白名单**)中 → 允许 pushToPack
//     · 分支不在白名单 / 无法确定分支(detached HEAD/无 .git,如 CI) → 跳过,只打日志,不算失败
//     · 传 -PdeployToPack 或 -PpackPush → 强制推送(手动出包用;务必与消费方成对推送)
//   **白名单优于黑名单**:新建分支默认落在"不推送"一侧,不会因为忘了登记而误推、误删整合包里的正式 jar。
//   需要推送时:把分支加进白名单;或单次用 -PdeployToPack 强制。
def packModsDir = file('D:/.minecraft/versions/狐の航空学 Voxy Edition/mods')
def jarArchiveProvider = tasks.named('jar').flatMap { it.archiveFile }

// --- 整合包推送的 git 分支守卫(配合上方约定) ---
// 分支判定放在**执行期**(见 pushToPack 的 doLast),不做配置期求值:
//   ① 每次构建都读当时的 .git/HEAD,切分支后立即生效,不存在配置缓存陈旧问题;
//   ② 不把 Provider/闭包塞进 configuration-cache,避免缓存序列化限制与行为漂移。
// dotGitEntry 是配置期算好的 File(可序列化),执行期读它即可 —— 普通仓库这里就是
// .git 目录;worktree 下它是**文件**,内容为 `gitdir: <path>`,真正的 HEAD 在 gitdir 下。
def packPushBranches = ['main']
def forcePackPush = project.hasProperty('deployToPack') || project.hasProperty('packPush')
def dotGitEntry = rootProject.file('.git')

tasks.register('pushToPack') {
    group = 'build'
    description = 'Copy the built jar into the NeoForge pack mods folder, removing stale versions. Skipped on development branches; force with -PdeployToPack.'
    dependsOn tasks.named('jar')
    doLast {
        // --- 约定:开发分支不推送整合包(见文件顶部「编译产物部署」) ---
        if (!forcePackPush) {
            // 执行期读取当前分支:普通仓库 .git 是目录;worktree 的 .git 是文件,内容记录 gitdir
            def readGitBranch = { File dotGit ->
                File headFile = null
                if (dotGit.isDirectory()) {
                    def hf = new File(dotGit, 'HEAD')
                    headFile = hf.isFile() ? hf : null
                } else if (dotGit.isFile()) {
                    def m = dotGit.text.trim() =~ /^gitdir:\s*(.+)$/
                    if (m.find()) {
                        def gd = new File(m.group(1).trim())
                        if (!gd.isAbsolute()) {
                            gd = new File(dotGit.parentFile, m.group(1).trim())
                        }
                        def hf = new File(gd, 'HEAD')
                        headFile = hf.isFile() ? hf : null
                    }
                }
                if (headFile == null) {
                    return ''
                }
                def s = headFile.text.trim()
                s.startsWith('ref: refs/heads/') ? s.substring('ref: refs/heads/'.length()) : ''
            }
            def branch = readGitBranch(dotGitEntry)
            if (branch.isEmpty()) {
                logger.lifecycle('pushToPack: skipped — 无法确定当前 git 分支(detached HEAD 或无 .git);如需强制推送请加 -PdeployToPack')
                return
            }
            if (!packPushBranches.contains(branch)) {
                logger.lifecycle("pushToPack: skipped — 分支 '${branch}' 不在整合包推送白名单 ${packPushBranches} 内;如需强制推送请加 -PdeployToPack")
                return
            }
        }
        def jarFile = jarArchiveProvider.get().asFile
        if (!jarFile.exists()) {
            logger.warn("pushToPack: built jar not found, skipped: ${jarFile}")
            return
        }
        if (!packModsDir.exists()) {
            def packRoot = packModsDir.getParentFile()
            if (packRoot == null || !packRoot.exists()) {
                logger.warn("pushToPack: pack dir not found, skipped: ${packModsDir}")
                return
            }
            packModsDir.mkdirs()
        }
        def stale = packModsDir.listFiles().findAll { File f ->
            f.isFile() && f.name.startsWith('starengine_lib-') && f.name.endsWith('.jar')
        }
        stale.each { it.delete() }
        def target = new File(packModsDir, jarFile.name)
        target.withOutputStream { out ->
            jarFile.withInputStream { inp -> inp.transferTo(out) }
        }
        logger.lifecycle("pushToPack: pushed ${jarFile.name} -> ${packModsDir}")
    }
}

tasks.named('build') {
    finalizedBy tasks.named('pushToPack')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
